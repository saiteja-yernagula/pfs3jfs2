let students=[
 {name:'john',marks:80},
 {name:'jessy',marks:90},
 {name:'jack',marks:50},
 {name:'jane',marks:24},
 {name:'jim',marks:20}
]

for (i of students){
    grade=''
    if(i.marks>70){
        grade='A'
    }else if (i.marks>35){
        grade='B'
    }else{
        grade="F"
    }
    let container=document.getElementById('container')
   
    let output=`
    <div class='card'>
        <h1>${i.name}</h1>
        <div>${i.marks}</div>
        <p>${grade}</p>
     </div>
        `
    container.innerHTML+=output
     
}
